<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Localive · Administration</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%238fdccb'/%3E%3Cstop offset='1' stop-color='%232e9e8c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/admin.css?v={{version}}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="orb" aria-hidden="true"></span>
        <div>
          <strong>Localive</strong>
          <span class="eyebrow">Serveur vocal</span>
        </div>
      </div>
      <button id="nav-toggle" class="btn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
      <nav id="nav" aria-label="Navigation principale"></nav>
    </aside>

    <main id="main" tabindex="-1">
      <div class="server-bar">
        <div class="row">
          <span id="foot-state" class="pill">…</span>
          <span id="foot-version" class="mono muted"></span>
        </div>
        <button id="restart" class="btn" type="button">Redémarrer Localive</button>
      </div>
      <div id="banner" class="banner" role="status" hidden></div>
      <div id="view"></div>
    </main>
  </div>

  <div id="savebar" class="savebar" hidden>
    <span id="savebar-text">Modifications non enregistrées</span>
    <div class="savebar-actions">
      <button id="discard" class="btn ghost">Annuler</button>
      <button id="save" class="btn primary">Enregistrer</button>
    </div>
  </div>

  <dialog id="login" class="dialog" aria-labelledby="login-title">
    <form method="dialog" id="login-form">
      <h2 id="login-title">Jeton d'accès</h2>
      <p class="muted">Ce Localive est protégé par un jeton (Serveur et sécurité → Jeton d'accès).</p>
      <label class="field">
        <span>Jeton</span>
        <input id="login-token" type="password" autocomplete="current-password" required>
      </label>
      <div class="dialog-actions"><button class="btn primary">Entrer</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/admin.js?v={{version}}" type="module"></script>
</body>
</html>
